name: containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:
    inputs:
      promote_to_stable:
        description: 'Type "promote" to retag current :canary as :stable (D5: no automatic path to stable)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway-concentratord
            context: containers/concentratord
          - name: gateway-mqtt-forwarder
            context: containers/mqtt-forwarder
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/buoy-fish/${{ matrix.name }}:canary
            ghcr.io/buoy-fish/${{ matrix.name }}:sha-${{ github.sha }}

  promote-stable:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_to_stable == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag canary digests as stable
        run: |
          for img in gateway-concentratord gateway-mqtt-forwarder; do
            docker buildx imagetools create \
              -t "ghcr.io/buoy-fish/${img}:stable" \
              "ghcr.io/buoy-fish/${img}:canary"
          done
