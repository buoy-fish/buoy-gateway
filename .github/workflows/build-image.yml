name: image

on:
  workflow_dispatch:
  push:
    tags: ['img-v*']

env:
  # pi-gen release tag 2026-06-18-raspios-bookworm-arm64 (pinned by SHA)
  PI_GEN_REF: d7a31c6aa09f4b867902c51da2b45807c0a1709e

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install qemu-user-static (arm64 chroot support)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Clone pi-gen at pinned ref
        run: |
          git clone https://github.com/RPi-Distro/pi-gen
          git -C pi-gen checkout "${PI_GEN_REF}"

      - name: Inject config + custom stage
        run: |
          cp image/config pi-gen/config
          cp -r image/stage-buoy pi-gen/stage-buoy
          # Export only the stage-buoy image, not the intermediate lite image.
          touch pi-gen/stage2/SKIP_IMAGES

      - name: Build image
        run: |
          cd pi-gen
          sudo ./build-docker.sh

      - name: Checksum
        run: |
          ls -la pi-gen/deploy
          cd pi-gen/deploy && sha256sum ./*.img.xz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: buoy-gateway-image
          path: |
            pi-gen/deploy/*.img.xz
            pi-gen/deploy/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/img-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "buoy-gateway image ${GITHUB_REF_NAME}" \
            --notes "pi-gen ${PI_GEN_REF} (2026-06-18-raspios-bookworm-arm64). See /etc/buoy/build-manifest inside the image for component versions." \
            pi-gen/deploy/*.img.xz pi-gen/deploy/SHA256SUMS
